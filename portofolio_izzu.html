<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Arsip Karya - Hanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f9f9f9; color: #333;
    }
    header {
      background: #222; color: #fff;
      padding: 20px; text-align: center;
    }
    .slider {
      position: relative;
      max-width: 800px;
      margin: 30px auto;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .slides {
      display: flex;
      transition: transform 0.8s ease-in-out;
    }
    .slides img {
      width: 100%;
      border-radius: 8px;
    }
    .caption {
      position: absolute;
      bottom: 15px; left: 20px;
      background: rgba(0,0,0,0.6);
      color: #fff; padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Portofolio Arsip Karya Hanan</h1>
    <p>Kumpulan karya seni intermedia & visual asap</p>
  </header>

  <!-- Slider -->
  <div class="slider">
    <div class="slides">
      <div>
        <img src="gambar1.jpg" alt="Karya 1">
        <div class="caption">Judul Karya 1 - Deskripsi singkat</div>
      </div>
      <div>
        <img src="gambar2.jpg" alt="Karya 2">
        <div class="caption">Judul Karya 2 - Catatan proses</div>
      </div>
      <div>
        <img src="gambar3.jpg" alt="Karya 3">
        <div class="caption">Judul Karya 3 - Refleksi pribadi</div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Hanan. Semua hak cipta dilindungi.</p>
  </footer>

  <script>
    const slides = document.querySelector('.slides');
    const totalSlides = slides.children.length;
    let index = 0;

    function showSlide() {
      index++;
      if (index >= totalSlides) index = 0;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    setInterval(showSlide, 4000); // ganti gambar tiap 4 detik
  </script>
</body>
</html>
